<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thmanyah live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0d10; color: #e8eaed;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  header { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    text-transform: uppercase; letter-spacing: .6px; color: #ff4d4f; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4f;
    animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .frame { width: min(1100px, 100%); aspect-ratio: 16/9; background: #000;
    border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .meta { font-size: 12px; color: #9aa0a6; text-align: center; }
  .meta a { color: #8ab4f8; text-decoration: none; }
</style>
</head>
<body>
  <header>
    <h1>thmanyah live</h1>
    <span class="live"><span class="dot"></span> live</span>
  </header>

  <div class="frame">
    <video id="v" controls autoplay muted playsinline></video>
  </div>

  <p class="meta" id="status">loading stream…</p>

  <script src="hls.min.js"></script>
  <script>
    var HLS_PATH = "${hls_path}";
    var LLHLS_PATH = "${llhls_path}";
    var v = document.getElementById("v");
    var statusEl = document.getElementById("status");
    var src = HLS_PATH; // relative path, same host as the player

    function fail(msg) { statusEl.textContent = msg; }

    if (v.canPlayType("application/vnd.apple.mpegurl")) {
      // safari and ios play hls natively
      v.src = src;
      v.addEventListener("loadedmetadata", function () { statusEl.textContent = "playing (native HLS)"; });
      v.addEventListener("error", function () { fail("stream not up yet, refresh in a sec"); });
    } else if (window.Hls && window.Hls.isSupported()) {
      var hls = new Hls({ lowLatencyMode: true });
      hls.loadSource(src);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { statusEl.textContent = "playing (hls.js)"; });
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data && data.fatal) fail("stream not up yet, refresh in a sec");
      });
    } else {
      fail("this browser can't play HLS");
    }
  </script>
</body>
</html>
